[project]
name = "geyser-ai"
version = "0.1.0"
description = "Probabilistic next-eruption prediction for Yellowstone geysers, built on public GeyserTimes data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "lifelines>=0.29",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.scripts]
geyser-ai = "geyser_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geyser_ai"]

[tool.ruff]
line-length = 100
