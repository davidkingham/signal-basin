[project]
name = "geyser-ai"
version = "0.1.0"
description = "Probabilistic next-eruption prediction for Yellowstone geysers, built on public GeyserTimes data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "lifelines>=0.29",
    "scipy>=1.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "simplemseed>=1.0.2",
]

[project.scripts]
geyser-ai = "geyser_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geyser_ai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Query()/Depends() in defaults is the documented idiom
    "SIM108", # ternaries are not always clearer than an if/else
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
